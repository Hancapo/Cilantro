<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Cilantro Importer</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="panel" role="main">
    <header class="panel__header">
      <div class="brand" aria-hidden="true">
        <span class="brand__mark"></span>
        <span class="brand__word">cilantro</span>
      </div>
      <h1 class="panel__title">Network settings</h1>
      <p class="panel__subtitle">Choose where assets are sent.</p>
    </header>

    <section class="panel__body" aria-label="Connection settings">
      <label class="field">
        <span class="field__label">Server</span>
        <input class="field__input" type="text" id="ip" placeholder="localhost" value="localhost" autocomplete="off" spellcheck="false" inputmode="text">
      </label>

      <label class="field">
        <span class="field__label">Port</span>
        <input class="field__input" type="number" id="port" placeholder="5000" value="5000" min="1" max="65535" inputmode="numeric">
      </label>

      <div class="actions">
        <button class="btn" id="save" type="button">
          <span class="btn__label">Save</span>
          <span class="btn__kbd" aria-hidden="true">Ctrl+S</span>
        </button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <footer class="panel__footer">
      <p class="hint">Endpoint: <span class="mono" id="endpoint">http://localhost:5000</span></p>
    </footer>
  </main>

  <script src="options.js"></script>
</body>
</html>
